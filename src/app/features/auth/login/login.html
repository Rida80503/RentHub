<!-- Main container: centers the login card vertically and horizontally. -->
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <!-- Login card containing the branding, form, and registration link. -->
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">

    <!-- RentHub logo linking back to the home page. -->
    <a routerLink="/" class="text-2xl font-extrabold text-blue-600">
      RentHub
    </a>

    <!-- Login page heading and introductory text. -->
    <h1 class="mt-8 text-3xl font-bold text-slate-900">
      Welcome back
    </h1>
    <p class="mt-2 text-slate-500">
      Sign in to continue to your RentHub account.
    </p>

    <!-- Display an error message when an authentication error occurs. -->
    <div
      *ngIf="errorMessage"
      class="mt-5 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <!-- Login form: validates input and calls onSubmit when submitted. -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-5">

      <!-- Email input and its validation messages. -->
      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
          Email address
        </label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          [class.border-red-500]="controls.email.invalid && controls.email.touched"
        />

        <!-- Show a validation message when the email field is empty. -->
        <p
          *ngIf="controls.email.touched && controls.email.hasError('required')"
          class="mt-1 text-sm text-red-600"
        >
          Email is required.
        </p>

        <!-- Show a validation message when the email format is invalid. -->
        <p
          *ngIf="controls.email.touched && controls.email.hasError('email')"
          class="mt-1 text-sm text-red-600"
        >
          Enter a valid email address.
        </p>
      </div>

      <!-- Password input and its validation message. -->
      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
          Password
        </label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          [class.border-red-500]="controls.password.invalid && controls.password.touched"
        />

        <!-- Show a validation message when the password field is empty. -->
        <p
          *ngIf="controls.password.touched && controls.password.hasError('required')"
          class="mt-1 text-sm text-red-600"
        >
          Password is required.
        </p>
      </div>

      <!-- Submit the login form. -->
      <button
        type="submit"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700"
      >
        Sign in
      </button>
    </form>

    <!-- Link new users to the registration page. -->
    <p class="mt-6 text-center text-sm text-slate-600">
      Don't have an account?
      <a routerLink="/register" class="font-semibold text-blue-600 hover:underline">
        Create account
      </a>
    </p>

  </div>
</div>
